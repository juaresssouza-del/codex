[project]
name = "tradelab-motor"
version = "0.3.0"
description = "Motor de pesquisa e backtest do TradeLab (Binance Spot e futuros B3)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "tzdata>=2024.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
